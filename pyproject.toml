[build-system]
# >=77 is required by the PEP 639 `license = "MIT"` / `license-files`
# syntax below; on an older setuptools that spelling is not understood.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aramid"
# PyPI PAGE METADATA. Absent until now, which was invisible while the only
# install path was a wheel URL: `twine check` reported `long_description
# missing`, i.e. publishing would have produced a package page with no
# description at all. Sourced from README.md and LICENSE rather than written
# fresh, so the page and the repo cannot drift into saying different things.
description = "A deterministic, offline security and quality gate for git hooks -- gitleaks, semgrep, ruff/eslint, pip-audit and your own suite, at pre-commit and pre-push."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Name only, deliberately no email: LICENSE already makes "FBMac" public, so
# this adds no disclosure, whereas putting a personal address on a public
# package page is the maintainer's call to make, not a default to inherit.
authors = [{ name = "FBMac" }]
keywords = ["security", "sast", "secrets", "git-hooks", "pre-commit", "static-analysis", "linting", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    # No "Typing :: Typed": that classifier asserts the package ships
    # type information, and there is no src/aramid/py.typed marker. The
    # claim would be false on a public page.
]

# SINGLE SOURCE OF TRUTH: src/aramid/__init__.py's `__version__`. Previously
# the version was spelled here AND there, so a bump could update one and ship
# a wheel whose metadata disagreed with the `--version` the code prints --
# silent, and only visible after release. Guarded by tests/unit/test_version.py.
dynamic = ["version"]
requires-python = ">=3.11"
# UPPER BOUNDS ARE LOAD-BEARING, NOT HOUSEKEEPING. aramid's proposition is a
# DETERMINISTIC gate, and an analyzer is not an implementation detail here --
# it IS the verdict. With lower bounds only, two teams installing aramid a
# month apart resolve different analyzers, get different findings on identical
# code, and the ratchet reads the delta as "new".
#
# Not hypothetical: ruff 0.16.1 widened its DEFAULT rule set (I, PL, RUF, UP,
# DTZ, ISC, FURB, FLY) and turned all seven CI legs red against a commit that
# was clean on 0.15.18, with no change to this repo at all.
#
# Bounds are set where each project has signalled breaking change: ruff is 0.x,
# so a MINOR bump is the breaking unit; the others follow semver majors.
#
# HONEST LIMIT: this bounds the blast radius, it does not make the gate
# reproducible. A patch release can still change what a rule reports. Pinning
# exactly (`==`) would do that, at the cost of conflicting with any consumer
# that pins its own ruff, and of aramid having to chase every release. Bounded
# ranges are the trade; a lockfile is the answer if exact reproducibility is
# ever required.
dependencies = [
    "tomli-w>=1.0,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.6,<0.17",
    "semgrep>=1.100,<2",
]

[project.urls]
Homepage = "https://github.com/jared0565/aramid"
Repository = "https://github.com/jared0565/aramid"
Changelog = "https://github.com/jared0565/aramid/blob/main/CHANGELOG.md"
Issues = "https://github.com/jared0565/aramid/issues"

[project.optional-dependencies]
# `packaging` is used by tests/unit/test_version.py to compare versions the way
# Python packaging itself does (PEP 440 normalization). It was already present
# transitively via pip-audit/semgrep; declared explicitly so the test suite does
# not rest on another package's dependency choices.
# `build` is here so tests/e2e/test_wheel_packaging.py can never degrade into a
# skip: a packaging test that quietly does not run looks exactly like one that
# passed. CI installed it as a separate step, which covered CI and left a fresh
# dev environment unable to run that test at all.
dev = ["pytest>=8", "pyyaml>=6", "packaging>=23", "build>=1"]

[project.scripts]
aramid = "aramid.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aramid.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aramid = ["data/*.toml", "data/*.tmpl", "rules/*.yml"]

# PIN THE RULE SET EXPLICITLY -- DO NOT DELETE AS "the default anyway".
#
# It is the default of ruff 0.15, and was not the default of ruff 0.16. With no
# `select` here, this repo silently inherits whatever the INSTALLED ruff
# defaults to, and `pyproject`'s own dependency is `ruff>=0.6` with no ceiling.
# ruff 0.16.1 widened its defaults (I, PL, RUF, UP, DTZ, ISC, FURB, FLY...), so
# the same commit that was clean on a developer's 0.15.18 produced 107 findings
# on CI's 0.16.1 and turned all seven legs red -- a build broken by an upstream
# release, with no change to this repo at all.
#
# Adopting those newer families is a real decision (some, like DTZ's naive
# datetimes, look worth having) -- but it is a deliberate one, made by editing
# this list, not one inflicted by whichever version a fresh `pip install`
# happens to resolve on the day.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# aramid's own gate runs ruff with the bandit-derived S family armed
# (src/aramid/runners/ruff.py). The test suite legitimately trips six of
# those rules by design: pytest asserts (S101), fake "secret" fixtures
# exercising the secret-handling paths (S105/S106/S107), and spawning real
# `git`/`python` to drive hooks and gates end-to-end (S603 "untrusted input",
# S607 "partial executable path").
#
# S603/S607 were the same shape as the other four but were never listed
# alongside them, so aramid's own gate carried 68 permanently-open findings
# against its own test tree -- the largest single source of noise in its own
# ledger, and precisely what teaches an operator to ignore a security tool.
# Spawning `git` by name IS the thing these e2e tests exist to do; an absolute
# path would test a different program than the one a developer runs.
#
# Scoped to tests/ only -- the S family stays fully armed for src/, where
# subprocess use is justified per-line with `noqa` instead. Both halves are
# guarded by tests/unit/test_repo_lint_config.py.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "S607"]
