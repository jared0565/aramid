# Built-in defaults -- the bottom layer of aramid.config.load_config's
# three-layer merge (defaults <- ~/.aramid/config.toml <- <root>/aramid.toml).
# `bake_started`, `test_command`, and `scope_subpath` are intentionally
# absent here (TOML has no null literal): load_config falls back to None
# for any key missing after the full merge.
schema_version = 1
semgrep_block_armed = false
tdd_block_armed = false

# Prefix/fnmatch entries dropped before any runner sees a file (spec section 8b).
# aramid.config.load_config ALWAYS unions these back in after merging repo/user
# config, regardless of what a repo's aramid.toml sets -- never removable.
ignore_paths = [
    ".aramid/", "graph-out/", ".graphite*", ".cache/",
    "node_modules/", ".venv/", "__pycache__/", ".git/",
]

[timeouts]
# Wall-clock budget in seconds, per gate (design doc section 3).
pre_commit = 5
pre_push = 300

# --- The repo's own test suite: the BLOCK-tier `tests` gate (pre-push) ---
[tests]
# false takes the BLOCK-tier test gate out entirely. It then neither runs nor
# counts as degraded -- otherwise disabling it would block every push, the
# very thing it exists to avoid. aramid prints a notice on every gate run
# where this suppresses the suite: a silently disabled block-tier check is
# strictly worse than no check at all.
enabled = true
# Per-invocation subprocess timeout, in seconds. CAPPED BY [timeouts] above:
# run_gate abandons any runner still going at the gate's wall-clock budget,
# so a timeout_s larger than that budget can never be reached (aramid warns
# when they are set incoherently). Raise BOTH to allow a longer run.
timeout_s = 300
# `command` is deliberately absent, like `test_command`/`bake_started` above
# (TOML has no null literal): absent means "auto-detect", i.e. `pytest -q`
# or `npm test` per detectors.detect_tests. Set it to point the gate at a
# fast subset -- the full suite of a mature repo rarely fits a push gate,
# and a gate you must routinely `--no-verify` past trains the bypass.
#   command = "pytest -q tests/unit"        # string: split POSIX-style
#   command = ["pytest", "-q", "tests/unit"]  # argv: no quoting rules at all
# Prefer the argv form on Windows -- POSIX splitting eats backslashes, so a
# `tests\unit` written as a string would lose its separator. Setting a
# command also makes the gate applicable to repos whose suite the pytest/npm
# heuristics do not recognize (a `make test` wrapper, a suite under a
# subpath). It is never run through a shell.

# --- Phase 2a (spec sections 3-4): zero-token triage, drain scheduling, pack ---
[triage]
min_score = 40
extra_security_paths = []

[drain]
interval_hours = 4
max_items_per_drain = 10
item_expiry_days = 30
wall_clock_budget_s = 600

[pack]
enabled = true
# Block-tier regression-pack rules (aramid-regression.block.*) enforce
# immediately when true (the default) -- their OWN arming flag, deliberately
# separate from the OWASP bake's `semgrep_block_armed` (see policy.py's
# _PACK_BLOCK_PREFIX). Set false to demote noisy pack rules to WARN.
pack_block_armed = true

# --- Phase 2b (spec sections 2-5): the LLM reviewer ---
[llm]
enabled = true
max_items_per_drain = 3
call_timeout_s = 240
packet_max_bytes = 120000
# Bake-then-arm (spec section 5): confirmed-CRITICAL LLM findings WARN until
# `aramid arm --llm` flips this. Independent of `semgrep_block_armed` and
# `pack_block_armed`.
llm_block_armed = false
provider_order = ["claude-cli", "codex-cli", "ollama-cloud"]
# openrouter is OPT-IN / in-app only -- NOT part of the dev-time default chain
# (model-source policy). To use it, add "openrouter" to provider_order and an
# openrouter arm to [[llm.ladder]] in a repo's aramid.toml. These keys are read
# only by the opt-in openrouter provider:
model_openrouter = "anthropic/claude-sonnet-4-5"
openrouter_monthly_cap_usd = 5.0
# Hard cap on refute calls across a whole drain (spec section 4). A single
# review response can surface many CRITICAL candidates, each of which would
# otherwise trigger its own refute call -- max_items_per_drain bounds REVIEWS,
# not refutes. This bounds the pathological many-criticals case: once the cap
# is hit, a further fresh CRITICAL is treated exactly like a transport-failed
# refute (demoted to high, confirmed=False, never block-eligible) -- fail-safe,
# never a wrong block. 6 comfortably covers a typical 1-2 criticals per item
# across the default 3 items before it ever clips.
max_refutes_per_drain = 6

# Reviewer model ladder (deterministic risk-tiered selection, design section 6).
# The arm whose min_score band contains an item's triage score reviews it;
# degrade-to-nearest-available on provider outage. Each tier is a different
# provider so the cross-provider refuter always differs in model family.
# effort verified live 2026-07-14: `claude --effort high` and codex
# `-c model_reasoning_effort=medium` both accepted (exit 0) -> set below.
# cheap/ollama effort stays "" DELIBERATELY: any non-empty effort maps to
# `think: true` (slower reasoning mode) -- wrong for the high-volume cheap
# tier. The cheap arm itself was live-verified 2026-07-14 (deepseek-v4-flash,
# 200 OK end-to-end).
# The mid model was gpt-5.6 (INVALID: "not supported ... with a ChatGPT account")
# -- corrected to gpt-5.5 (the codex config default) during live verification.
[[llm.ladder]]
tier = "cheap"
provider = "ollama-cloud"
model = "deepseek-v4-flash"   # live-verified 2026-07-14; tune per your account
effort = ""
min_score = 40

[[llm.ladder]]
tier = "mid"
provider = "codex-cli"
model = "gpt-5.5"
effort = "medium"
min_score = 60

[[llm.ladder]]
tier = "frontier"
provider = "claude-cli"
model = "opus"
effort = "high"
min_score = 80

# --- Auto-learn (autolearn spec sections 7-10): learned UPLIFT over the ladder ---
# Shadow-first, bake-then-arm: with the defaults below the engine records
# telemetry, computes shadow decisions, and runs audit double-reviews, but
# NEVER changes which arm serves. `aramid arm --autolearn` flips `armed`
# per-repo. Escalate-only either way: the ladder tier is a floor.
[llm.autolearn]
enabled = true
armed = false
# Serve the lowest arm whose Thompson-sampled miss probability is <= this.
# No-data prior Beta(1, 9) has mean 0.10 <= 0.15, so cold start == ladder.
uplift_threshold = 0.15
# Audit 1 in N below-frontier reviews with a frontier double-review
# (deterministic hash of the item id) -- the miss-rate measurement, active
# in shadow too; costs flat-rate quota only.
audit_every = 8
max_audits_per_drain = 1
# Cascade re-review (armed only) when the served review shows danger signs:
# a verified CRITICAL, hallucination_rejected >= this, or a truncated packet.
cascade_hallucination_min = 3

# --- Phase 2c-1 (spec section 4): drain-time mutation consumer ---
[mutation]
enabled = true
max_mutants = 20        # generated-and-tested per queue item
wall_budget_s = 600     # whole-item wall clock for the mutant loop
mutant_timeout_s = 120  # per pytest invocation (stage 1 and stage 2 alike)
confirm_cap = 3         # full-suite confirmation runs per item
mutation_block_armed = false   # NEW (1b) -- arms surviving-mutant findings; see policy.classify
score_block_armed = false      # NEW (2b) -- arms mutation-score transition regressions; see policy.classify

[tdd]
enabled = true

# --- TDD gate sub-project 3: red-first proof at pre-push ---
[red_proof]
enabled = true
red_proof_block_armed = false   # bake-then-arm; `aramid arm --red-proof` flips it
wall_budget_s = 120             # whole-scan wall clock (all changed test files)
test_timeout_s = 60             # per pytest invocation against the base tree

# --- Phase 2c-1b: drain-time JS/TS mutation consumer ---
[js_mutation]
enabled = true
max_mutants = 20        # generated-and-tested per queue item
wall_budget_s = 600     # whole-item wall clock for the mutant loop
mutant_timeout_s = 120  # per `<pm> test` invocation (single-stage)

# --- Phase 2c-2 (spec section 5): drain-time fuzz consumer ---
[fuzz]
enabled = true
max_functions = 10        # fuzzed per queue item
cases_per_function = 50
wall_budget_s = 300       # whole-item wall clock
batch_timeout_s = 120     # the single driver subprocess
skip_name_patterns = [
  "*deploy*", "*delete*", "*remove*", "*drop*", "*push*", "*send*",
  "*upload*", "*kill*", "*wipe*", "*publish*", "*destroy*", "*truncate*",
]

# --- Phase 2c-3 (spec section 8): drain-time DAST passive web-hygiene prober ---
[dast]
enabled = true
base_url = ""            # e.g. "https://staging.example.com" -- empty => OK-skip
paths = []               # extra paths to probe on top of the curated exposed set
timeout_s = 10           # per-request timeout
block_armed = false      # RESERVED: inert in 2c-3 (WARN-only); unit-4 wires the BLOCK branch
# start_command = ""     # RESERVED for 2c-3b explicit-config auto-start; ignored here

# --- cargo-audit informational warnings (operation-firewall round 20) ---
# RUSTSEC publishes `warnings` (unmaintained / unsound / yanked crates)
# alongside `vulnerabilities`. They are supply-chain signal, but most carry
# no fix -- an unmaintained crate stays unmaintained -- so surfacing them by
# default would be a permanent, unactionable finding on every Rust repo.
# Off by default; a repo whose threat model names supply-chain compromise
# opts in. They are WARN-tier by construction and can NEVER block: see
# policy.classify's unconditional branch and the pre-push ratchet exemption
# in pipeline.py, both of which are load-bearing rather than belt-and-braces.
[deps]
cargo_audit_warnings = false
