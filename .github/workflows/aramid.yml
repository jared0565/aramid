# CI for aramid itself: install the package, run its test suite, dogfood the
# gate against its own repo, and sanity-check the built wheel.
#
# MATRIX RATIONALE. This ran as a single windows-latest / Python 3.12 job until
# 2026-07-25, which left two claims untested:
#
#   1. Platform. src/aramid has 17 platform branches across 11 modules
#      (doctor, drain, schedule, dast, dast_probe, js_mutation, providers/base,
#      runners/base, runners/eslint, runners/typecheck, toolpath). Every
#      non-Windows branch had never executed anywhere. toolpath is the sharp
#      case: it sits in the resolution path EVERY runner depends on, and if it
#      misbehaves off Windows the tools come back MISSING -- which at pre-push
#      escalates to exit 1, so a Linux user's first run would be "everything
#      degraded" from code that looks correct here.
#   2. Python version. pyproject declares requires-python = ">=3.11"; CI proved
#      3.12 only. Local development runs 3.14, so the version actually used
#      day to day was never the version CI tested.
#
# windows-latest stays the primary and keeps 3.14 (the dev version): the E2E
# suite (tests/e2e/test_windows_hooks.py) is Windows-only -- git hook shims,
# PATH resolution, taskkill process-tree kill -- and skips cleanly elsewhere,
# so only the Windows legs keep that coverage live rather than silently
# skipped. ubuntu carries the version spread because it is the cheapest
# runner and the platform most third-party CI will actually use.
#
# fail-fast is off deliberately: the point of the first matrix run is to learn
# EVERY place the platform assumption leaked, not just the earliest one.
name: aramid

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # primary; only legs that run the E2E suite
            python: "3.12"
          - os: windows-latest   # the version developed on locally
            python: "3.14"
          - os: ubuntu-latest    # the requires-python floor
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
    steps:
      # PINNED TO COMMIT SHAs, NOT TAGS. A tag is a mutable pointer: whoever
      # owns the action (or compromises them) can move it, and the next run
      # here executes different code with no diff in this repo and nothing in
      # the log to notice. That matters more than usual because these steps
      # are not just infrastructure -- the dogfood steps below are what prove
      # aramid's gate works, so whatever runs here decides whether a finding
      # gets reported at all. A tool that flags this in other people's repos
      # should not ship it in its own. Trailing comments carry the readable
      # version; tests/unit/test_workflow_pinning.py enforces both halves.
      #
      # v7/v7 target Node 24. v4/v5 targeted Node 20, which GitHub deprecated:
      # runs still passed but every one carried a "being forced to run on
      # Node.js 24" annotation, i.e. we were already on 24 without having said
      # so. Neither bump costs us anything -- checkout v7's fork-PR block only
      # applies to pull_request_target/workflow_run (we use neither), and
      # setup-python v7 removes the pip-install input (we never set it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: gitleaks/fingerprint scanning wants real commit history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install aramid (pulls in ruff, semgrep, pip-audit as deps)
        run: pip install -e .[dev]

      - name: Install pinned gitleaks binary onto PATH
        uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873 # v1.3.2
        with:
          version: 8.28.0
          run: false # install only -- aramid's own gate invokes gitleaks itself

      - name: Run test suite
        run: python -m pytest -q

      # Dogfood: run aramid's own gate against this repo as the CI backbone.
      # Exit-code contract (see docs/superpowers/specs/2026-07-12-aramid-phase1-design.md):
      #   0 = pass, 1 = blocking finding, 2 = degraded (a tool errored/unavailable),
      #   3 = engine error. --strict remaps 2 and 3 onto 1 so CI treats "couldn't
      #   tell" the same as "failed" instead of silently passing.
      - name: Run aramid gate (--all --strict --json)
        run: python -m aramid check --all --strict --json

      # THE STEP ABOVE IS PRE-COMMIT TIER, WHICH IS WEAKER THAN IT READS.
      # `--all` widens the FILE set, never the runner set, and `--gate` defaults
      # to pre-commit -- so that step runs gitleaks + ruff only. Until this was
      # added, CI never invoked semgrep through the gate at all, and the claim
      # that aramid dogfoods its own engine in CI was false. (Gate.ALL exists in
      # GATE_RUNNER_KEYS but is unreachable from the CLI.)
      #
      # ADDITIVE ON PURPOSE, NOT A REPLACEMENT: the two tiers are complementary,
      # not nested. ruff runs ONLY at pre-commit; semgrep and tests run ONLY at
      # pre-push (pipeline.GATE_RUNNER_KEYS). Swapping the step above for this
      # one would silently drop ruff from CI.
      #
      # WHAT THIS BUYS, precisely: it proves semgrep actually RUNS here, and
      # that the vendored OWASP ruleset resolves and PARSES rather than merely
      # existing. semgrep cannot fail the build on findings while the WARN-only
      # bake is unarmed, but a semgrep that is missing or crashing degrades the
      # run, and `--strict` turns that into exit 1. A ruleset broken at load
      # time would otherwise surface first in a consumer repo.
      #
      # WHAT IT DOES NOT PROVE: this job installs with `pip install -e .`, so
      # the ruleset is read from the source tree, not from a built wheel. The
      # "Verify packaged data files" step below checks the wheel CONTAINS the
      # file; nothing yet loads semgrep against an installed (non-editable)
      # aramid. Do not read a green run here as wheel-level proof.
      #
      # COST: the gate's BLOCK-tier `tests` runner re-runs tests/unit (per
      # aramid.toml), so this duplicates part of the suite step above. That is
      # the price of exercising the real gate end-to-end; the legs run in
      # parallel, so it costs wall-clock once, not seven times.
      #
      # TEETH VERIFIED, not assumed: run against a fresh clone with a planted
      # AWS credential, this exits 1 with a gitleaks BLOCK. Against the clean
      # tree it exits 0 with zero findings and nothing degraded.
      - name: Run aramid gate at pre-push tier (semgrep + tests)
        run: python -m aramid check --gate pre-push --all --strict --json

      # The step above is only worth having if semgrep ACTUALLY ran, and its
      # own exit code cannot tell you that: runner selection is gate- AND
      # stack-dependent, so a future edit to GATE_RUNNER_KEYS or to a runner's
      # applicability could quietly shrink the set back to nothing and the step
      # would still exit 0. Green for the wrong reason is precisely the defect
      # this pair of steps exists to correct, so assert it rather than trust it.
      #
      # `tools` in the RUN_STARTED payload is scope_tools -- the runners that
      # reported ToolState.OK -- so membership means "ran and completed", not
      # merely "was selected". A crashed semgrep is caught by --strict on the
      # step above; this catches the quieter case where it was never run.
      #
      # Only semgrep is asserted. The tests slot is reported under
      # Path(argv[0]).name, which is "python" for this repo's configured
      # [tests].command, and asserting an argv-derived name would break the
      # moment that command changes. The full list is printed so a human can
      # see it.
      - name: Assert the pre-push gate really ran semgrep
        shell: python
        run: |
          import json
          import pathlib
          import sqlite3
          import sys

          db = pathlib.Path(".aramid/ledger.db")
          if not db.exists():
              sys.exit(f"::error::{db} missing -- the gate step wrote no ledger")

          con = sqlite3.connect(db)
          rows = con.execute(
              "select payload from events where type='run_started' order by rowid"
          ).fetchall()
          con.close()

          pre_push = [json.loads(p) for (p,) in rows if p]
          pre_push = [d for d in pre_push if d.get("gate") == "pre-push"]
          if not pre_push:
              sys.exit("::error::no pre-push run recorded -- the gate step did "
                       "not run at the tier this job claims to exercise")

          tools = pre_push[-1].get("tools") or []
          print(f"pre-push gate completed these runners: {sorted(tools)}")
          if "semgrep" not in tools:
              sys.exit("::error::semgrep did not run in the pre-push gate "
                       f"(completed: {sorted(tools)}). CI would be reporting a "
                       "pass for a tier it never exercised.")

      # WHEN THIS JOB GOES RED, SAY WHICH TEST. A blocking gate writes its
      # reason to `.aramid/logs/<tool>-<run_id>.log` and nowhere else: the
      # finding carries evidence=None and the directory is gitignored. On
      # 2026-08-06 the windows-latest/py3.14 leg failed at the pre-push step
      # with "tests-failed", passed on re-run with no code change, and the one
      # string naming the failing test died with the container. Six legs were
      # green, so that is a live intermittent in the suite of a tool whose
      # whole claim is deterministic verdicts -- and it is unidentified.
      #
      # PLACEMENT. `if: failure()` fires for any earlier failed step even
      # though the steps between it were skipped, so one step here covers both
      # gate tiers rather than one per tier. It must sit after both, which
      # tests/unit/test_ci_log_dump.py asserts by parsing this file.
      #
      # ALWAYS EXITS 0. It is a diagnostic; a second red step would only bury
      # the first. That is also why it is a committed file rather than an
      # inline `shell: python` block -- a dump that silently prints nothing
      # looks identical to one that correctly found nothing, so every branch
      # of it is pinned by unit tests that run it as a subprocess.
      #
      # PUBLIC BY DESIGN: this repo is public, so this publishes scan logs of
      # sources that are already public, scrubbed of the run's gitleaks
      # secrets by pipeline._write_logs. The python-*.log body is the same
      # pytest output the `Run test suite` step already prints on every run.
      - name: Dump .aramid/logs on failure (names the failing test)
        if: failure()
        run: python .github/scripts/dump_aramid_logs.py

      - name: Install build backend
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      # Closes the "wheel data inclusion verified by inspection only" gap:
      # actually unzip the built wheel and assert the packaged data files
      # exist on disk, rather than trusting package-data globs by eye.
      - name: Verify packaged data files are present in the wheel
        shell: python
        run: |
          import pathlib
          import sys
          import tempfile
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          required = [
              "aramid/data/block_rules.toml",
              "aramid/data/defaults.toml",
              "aramid/rules/owasp.yml",
          ]

          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(wheel) as zf:
                  zf.extractall(tmp)
              tmp_path = pathlib.Path(tmp)
              missing = [f for f in required if not (tmp_path / f).exists()]

          if missing:
              print(f"::error::missing packaged data file(s) in {wheel.name}: {missing}")
              sys.exit(1)

          print(f"OK: {wheel.name} contains all required data files: {required}")
