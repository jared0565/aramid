# Tag-triggered release: build the wheel + sdist and attach them to a GitHub
# Release, so `pip install -e .` from a source checkout stops being aramid's
# only install path.
#
# Two jobs, deliberately split. `release` uses the built-in GITHUB_TOKEN only
# and produces a GitHub Release, which can be deleted if something is wrong.
# `publish-pypi` is the IRREVERSIBLE half -- PyPI forbids re-uploading a
# version, and the first upload claims the public name for good -- so it is
# gated on the `pypi` environment, runs only after every check below has
# passed, and uses Trusted Publishing (OIDC): no API token, no repository
# secret to leak or rotate.
#
# ONE-TIME SETUP, on the maintainer's account, before the first tag:
#   pypi.org -> Your projects -> Publishing -> add a PENDING publisher
#     owner: jared0565   repo: aramid
#     workflow: release.yml   environment: pypi
# TestPyPI is a SEPARATE account with a SEPARATE pending publisher; configuring
# one does not configure the other.
#
# Every gate below runs BEFORE the release is created, because a bad artifact
# that is already published cannot be recalled -- only superseded.
name: release

on:
  push:
    tags: ["v*"]

# Needed to create the Release. Everything else stays read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs -- see the rationale in aramid.yml. It binds
      # harder here: this workflow has `contents: write` and publishes the
      # artifact users install, so a moved tag upstream could alter what gets
      # built and released under aramid's name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # FAIL FAST, BEFORE BUILDING. `aramid.__version__` is the single source of
      # truth (pyproject reads it via `dynamic`), so a tag that disagrees with
      # it would publish `aramid-0.1.0.whl` under a tag called v0.2.0 -- a
      # mismatch nobody notices until someone reports the wrong version.
      - name: Assert the tag matches aramid.__version__
        shell: python
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          src = pathlib.Path("src/aramid/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.M)
          if not m:
              sys.exit("::error::could not find __version__ in src/aramid/__init__.py")

          version = m.group(1)
          if tag != f"v{version}":
              sys.exit(f"::error::tag {tag} does not match __version__ {version} "
                       f"-- expected tag v{version}. Bump __version__ or retag.")
          print(f"tag {tag} matches __version__ {version}")

      - name: Install build backend
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      # Same check the CI workflow runs, repeated here because THIS is the
      # artifact that reaches users. A wheel missing the vendored ruleset makes
      # semgrep crash on every pre-push in every consumer repo, and the failure
      # would appear far from its cause.
      - name: Verify packaged data files are present in the wheel
        shell: python
        run: |
          import pathlib
          import sys
          import tempfile
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          required = [
              "aramid/data/block_rules.toml",
              "aramid/data/defaults.toml",
              "aramid/rules/owasp.yml",
          ]

          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(wheel) as zf:
                  zf.extractall(tmp)
              tmp_path = pathlib.Path(tmp)
              missing = [f for f in required if not (tmp_path / f).exists()]

          if missing:
              sys.exit(f"::error::missing packaged data file(s) in {wheel.name}: {missing}")
          print(f"OK: {wheel.name} contains all required data files: {required}")

      # The render test for the PyPI page itself. Until the metadata was
      # filled in, this reported `long_description missing` -- i.e. publishing
      # would have produced a package page with no description at all, which
      # nothing else here would have caught.
      - name: Check the distribution metadata renders
        run: |
          pip install twine
          twine check dist/*

      # Install the BUILT WHEEL into a clean venv and run the CLI from it. The
      # CI workflow only ever exercises `pip install -e .`, so nothing until
      # now proved a non-editable install works at all -- that the console
      # script is generated, the package imports without the source tree, and
      # the vendored ruleset resolves from inside site-packages.
      - name: Smoke-test the built wheel in a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp   # leave the source tree, so an accidental import of it fails
          /tmp/smoke/bin/aramid --version
          /tmp/smoke/bin/python -c "
          import pathlib
          from aramid.runners import semgrep
          p = pathlib.Path(semgrep.VENDORED_RULES_PATH)
          assert p.is_file(), f'vendored ruleset missing from the installed package: {p}'
          print(f'vendored ruleset resolved at {p}')
          "

      # THE SDIST WAS PUBLISHED BUT NEVER INSTALLED. The step above proves the
      # wheel; the sdist was only globbed into `gh release create`. They are
      # built by different code paths -- package-data reaching a wheel does not
      # prove it reaches an sdist -- and any consumer on a platform or policy
      # that forces a source build gets this artifact, not the wheel. `--no-deps`
      # because the dependency set is already proven above; what is unproven
      # here is whether the SOURCE archive carries its data files.
      - name: Smoke-test the built sdist in a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-sdist
          /tmp/smoke-sdist/bin/pip install --quiet --no-deps dist/*.tar.gz
          cd /tmp
          /tmp/smoke-sdist/bin/python -c "
          import pathlib
          from aramid.runners import semgrep
          p = pathlib.Path(semgrep.VENDORED_RULES_PATH)
          assert p.is_file(), f'vendored ruleset missing from the SDIST install: {p}'
          print(f'sdist install resolved the vendored ruleset at {p}')
          "

      # Name the artifacts rather than globbing. `dist/*` uploads whatever
      # happens to be in that directory, and every step above builds into it
      # -- so a leftover from an earlier build, or anything a future step
      # drops there, would be published under the release with no one having
      # chosen it. Publishing is the irreversible half of this workflow, so it
      # gets the explicit list. A missing artifact now fails the step instead
      # of silently releasing a subset.
      - name: Create the GitHub Release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s failglob
          gh release create "${GITHUB_REF_NAME}" \
            dist/aramid-*.whl dist/aramid-*.tar.gz \
            --generate-notes --verify-tag

      # Hand the GATED bytes to publish-pypi so both public channels carry the
      # same artifact. Named, not globbed, for the same reason as the release
      # step above. `if-no-files-found: error` because an empty upload here
      # would surface as an empty publish -- a no-op that looks like success.
      - name: Upload the gated distribution for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gated-dist
          path: |
            dist/aramid-*.whl
            dist/aramid-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # THE REHEARSAL, and the reason it is a gate rather than an option.
  #
  # PyPI's first upload claims the name permanently and no version can ever be
  # re-uploaded, so the one path that must not run for the first time against
  # production is this one. TestPyPI exercises the parts nothing else can: the
  # gated-dist upload/download round-trip, the OIDC trusted-publishing
  # exchange, and the rendered package page -- which a maintainer can actually
  # look at before the real name is claimed. RELEASING.md used to offer this as
  # "if you want to rehearse first" with no job to do it, i.e. a setup step
  # that did nothing.
  #
  # `skip-existing: true` here and NOT on PyPI below, deliberately. TestPyPI
  # also forbids re-uploading a version, so without it any re-run of a
  # partially-failed release is dead on arrival. On PyPI a skip would be a
  # silent no-op that exits green -- the one shape this repo exists to prevent.
  publish-testpypi:
    needs: release
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: gated-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  # Separate job so the irreversible step cannot run unless every gate in
  # `release` passed AND the same artifact published cleanly to TestPyPI.
  # `needs` gives the ordering; `environment` is what lets a required reviewer
  # be added on the PyPI side without touching this file.
  publish-pypi:
    needs: [release, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing exchanges this OIDC token for a short-lived PyPI
      # credential. `contents` is NOT needed here -- this job builds nothing
      # and writes nothing to the repository.
      id-token: write
    steps:
      # PUBLISH THE BYTES THE GATES INSPECTED -- do not rebuild here.
      #
      # This job used to `actions/checkout` and `python -m build` again, on the
      # stated theory that "an artifact round-trip is one more place the bytes
      # could differ from what the gates above actually inspected, and the build
      # is deterministic from the tag". That reasoning is backwards. An artifact
      # transfers the EXACT inspected bytes; a rebuild manufactures new ones that
      # none of the four gates in `release` (twine check, packaged-data check,
      # wheel smoke test, sdist smoke test) ever saw. `needs: release` ordered
      # the jobs and proved nothing about the artifact that actually reached
      # PyPI. Determinism was an assumption, not an enforced control -- a
      # different setuptools/build resolution at this job's own `pip install
      # build` is enough to diverge.
      #
      # It also meant the GitHub Release and PyPI could carry DIFFERENT
      # artifacts under the same version, on two public channels, and PyPI
      # cannot be re-uploaded once a version is taken.
      #
      # No checkout and no setup-python: this job now builds nothing, and the
      # publish action reads `dist/` directly.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: gated-dist
          path: dist

      # Irreversible destination, so say out loud what is going. `print-hash`
      # below reports what PyPI received; this reports what we handed it, and
      # the two must agree.
      - name: Show exactly what is about to be published
        run: |
          set -euo pipefail
          ls -l dist
          sha256sum dist/*

      # SHA resolved from the v1.14.2 ANNOTATED tag object to its commit --
      # `git/ref/tags/<tag>` returns the tag object's own sha for an annotated
      # tag, which is not what `uses:` pins to.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Fail loudly rather than skip: a silent no-op on a release tag is
          # exactly the "green for a reason indistinguishable from success"
          # shape this repo exists to prevent.
          skip-existing: false
          print-hash: true
