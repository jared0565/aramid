# entries above unchanged -- only these two moved, and only because the rule
# moved with them.
#
# Neither entry goes stale on the version that does not produce it: stale
# detection needs a NEAR MISS (same tool+rule+path, different id), and the
# whole point here is that the rule differs. Verified by running both.
