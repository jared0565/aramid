# runs that test -- and it retires by widening `[mutation].test_command`. The
# second is an EQUIVALENT MUTANT: no test can ever kill it, because it cannot
# change what the program does. Filing both as "false positive" would lose that,
# and the second would sit on a to-do list forever waiting for a test nobody can
# write.
#
