# --- Tier note (design doc section 6 amendment, 2026-08-09) -----------------
# This file takes ANY verdict, not only BLOCK. Until 2026-08-09 it applied to
# BLOCK findings only, which made a WARN entry here a silent no-op: it matched
# nothing and was not reported stale either, because its id IS among the
# findings. The file could authorize the dangerous suppression and not the safe
# one. The ledger (`aramid override`) is still WARN-only, and for a reason that
# is not symmetric -- `.aramid/` is gitignored, so a BLOCK hidden there is a
# decision nobody can review.
#
#   ledger override    "quiet this for me, on this machine."   WARN only.
#   this file          "the team decided this, reviewably."    Any tier.

# --- false survivors from a bounded mutation suite --------------------------
#
# THE FIRST NON-BLOCK ENTRIES IN THIS FILE, and the first that reach a
# ledger-SYNTHESIZED producer at all -- until 2026-08-10 this file could not
# bind a mutation finding no matter what it said (fixed in 701b6bd/ca584d1).
#
# Both are proven false, first-hand and not inherited: each mutant was applied
# to `src/aramid/pipeline.py` by line number and
# `tests/integration/test_resolution_scope.py` failed, killing it. They are
# reported as survivors because `[mutation].test_command` is `pytest -q
# tests/unit` -- deliberately bounded, since the whole tree (~1141 s) does not
# fit the `mutant_timeout_s * 4` baseline budget and inheriting it recreated
# the "44 drains, zero findings" defect. The engine never runs the test that
# kills these.
#
# So this is a KNOWN ENGINE LIMITATION, not a test gap, and the class is
# general: any code whose only coverage is an integration or e2e test will
# report survivors here forever. Findings now name the suite they were checked
# against ("unkilled by: pytest -q tests/unit") so the next reader can tell
# "you have a gap" from "the engine did not run your test" without re-deriving
# it. Suppressed rather than left open because a finding proven false is the
# noise that teaches an operator to stop reading the tool.
#
# THE CORRECT WAY TO RETIRE THESE is to widen the mutation suite, not to edit
# them. If `_resolution_scope` changes, both ids change, these stop matching,
# and aramid reports them stale -- which is the intended outcome, since the
# proof above would no longer apply to the new code.

# --- two survivors in cli.py, false for TWO DIFFERENT REASONS ---------------
#
# Worth separating, because the correct response to each is opposite. The first
