# --- Tier note (design doc section 6 amendment, 2026-08-09) -----------------
# This file takes ANY verdict, not only BLOCK. Until 2026-08-09 it applied to
# BLOCK findings only, which made a WARN entry here a silent no-op: it matched
# nothing and was not reported stale either, because its id IS among the
# findings. The file could authorize the dangerous suppression and not the safe
# one. The ledger (`aramid override`) is still WARN-only, and for a reason that
# is not symmetric -- `.aramid/` is gitignored, so a BLOCK hidden there is a
# decision nobody can review.
#
#   ledger override    "quiet this for me, on this machine."   WARN only.
#   this file          "the team decided this, reviewably."    Any tier.
