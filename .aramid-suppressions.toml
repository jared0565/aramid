# Reviewed, committed suppressions for aramid's own repo. Every entry below
# happens to be BLOCK-tier; the file itself accepts ANY tier (see the tier note
# at the bottom).
#
# WHY THIS FILE EXISTS. `aramid override` deliberately refuses BLOCK-tier
# findings and points here instead, because suppressing a blocking security
# finding should be a reviewable change in version control -- not a local
# ledger entry only its author can see. Until this file existed, aramid's own
# ten fixture "secrets" were suppressed via machine-local `ledger
# mark-not-a-secret` calls, so CI and every fresh clone still reported ten
# unrotated credentials. aramid was not using the mechanism it ships.
#
# Matching is by finding `id`, which is a content fingerprint (tool, rule,
# path, line content, occurrence) and carries no per-machine salt -- so these
# entries resolve identically in every clone. `tool`/`rule`/`path` are
# recorded for readability and for stale-entry detection: if a fixture is
# edited its id changes, this entry stops matching, and aramid reports it as a
# stale suppression rather than silently covering nothing.
#
# EVERY REASON BELOW WAS RE-VERIFIED AGAINST THE FILE, not inherited from an
# earlier triage note. A suppression is a standing assertion that something is
# safe; it deserves a first-hand check each time it is written down.

# --- AWS access-key IDs -----------------------------------------------------
