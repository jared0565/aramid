# aramid dogfoods itself: this is the config a maintainer's `aramid init .`
# would write, plus the overrides below.
# Bump this in lockstep with aramid's CURRENT_SCHEMA_VERSION on a schema
# change, or aramid will print a schema-mismatch warning on every run here.
schema_version = 1

# The other two keys `aramid init` writes (config.py:259-263). They were missing
# here, so the claim above was false and `aramid status` printed "bake in
# progress, day ? (bake_started not set in aramid.toml)" while ARAMID.md:146-147
# tells operators to consult that exact field.
#
# NEITHER CHANGES BEHAVIOUR. `semgrep_block_armed = false` is the value the
# dataclass already defaulted to (config.py:157, `merged.get(..., False)`);
# stating it explicitly only lets `aramid arm` rewrite the key in place
# (arm.py:206) instead of inserting it above `[tests]` (arm.py:213 -- this file
# has section headers, so the EOF-append branch never applies to it).
# `bake_started` is read at exactly one place -- `_bake_lines` in
# commands/status.py:142-149 -- and is display-only; no gate reads it.
#
# The date is a START-FROM-NOW, not a reconstruction: nothing recorded when the
# bake actually began, so backdating would assert a fact no one can support.
# Whether semgrep should instead be armed outright is a posture call for the
# maintainer -- `aramid arm`, per ARAMID.md:149, there is no auto-promotion.
semgrep_block_armed = true
bake_started = "2026-08-02"

# Point the BLOCK-tier pre-push test gate at the unit suite.
#
# WHY: `tests` is BLOCK-tier, and the full suite takes ~15 min locally against
# a 300 s gate budget ([timeouts].pre_push), so it always TIMEOUTs -> degraded
# -> exit 1. Every push blocked, on aramid's own repo. The alternative is
# living on `git push --no-verify`, which disables gitleaks and the ratchet
# too -- strictly worse than gating on a fast subset.
#
# WHAT THIS COSTS: the push gate no longer covers tests/integration or
# tests/e2e. That coverage lives in CI, which runs the full `python -m pytest`
# on every push across the 7-leg matrix -- so nothing is unverified, it is
# verified a few minutes later instead of before the push.
#
# CI PARITY. This is deliberately the same command CI's "Run test suite" step
# runs -- the WHOLE tree, not `tests/unit`. The point of a pre-push gate is
# that what passes here passes there, and the ~370 integration and e2e tests
# that `tests/unit` excludes are exactly the ones most likely to break on a
# different machine. Scoping this narrowly bought a fast push and paid for it
# in CI round-trips.
#
# What it does NOT buy is full parity, and the difference is worth stating:
# CI runs seven legs (3 OS x 4 pythons) and this runs one, so a
# platform-specific failure can still only be caught there.
#
# The argv form is used rather than a string because POSIX splitting eats
# backslashes and this repo's primary dev platform is Windows.
[tests]
command = ["python", "-m", "pytest", "-q"]
# The whole tree measured ~1141 s; `tests/unit` alone was ~243 s under the old
# 600 s cap. A timeout is not a cost -- it never slows a passing push -- but
# too tight a one blocks EVERY push, so this keeps a similar ratio of headroom
# to the new figure rather than a similar absolute margin.
timeout_s = 2400

# Headroom over that measured ~243 s. These are TIMEOUTS, not costs: raising
# the cap does not slow a passing push by one second, it only widens how slow
# a run may get before the gate calls it hung. 300 s left just 57 s of margin
# against a unit suite that grows with every task -- and the failure mode when
# it crosses is not a warning, it is every push blocked. The only price is
# that a genuinely hung suite takes 10 min rather than 5 to be declared hung.
[timeouts]
# Raised with [tests].timeout_s for the same reason: this is the WHOLE-GATE
# budget, so leaving it at 600 s would call a healthy push hung after ten
# minutes while its (now legitimately ~19 min) test runner was still working.
# A per-runner cap that exceeds the gate cap is a cap that never fires.
pre_push = 2700

[hooks]
# Run the pre-push shim with the argv CI step 8 uses (`--all --strict`)
# rather than the default `range` scope, so a finding in a file this push
# did not touch is caught here instead of on the seven-leg matrix.
#
# Safe to enable HERE specifically: this repo's ledger has already been
# scanned with `--all` many times, so there is no backlog of never-seen ids
# for the ratchet to escalate. A repo turning this on for the first time
# should pair it with `aramid rebaseline` -- see defaults.toml.
pre_push_match_ci = true

# --- Mutation testing: budgets sized to THIS repo's measured suite ---------
#
# Mutation ran 44 times here and produced ZERO findings, degraded 38 of those,
# every time reporting "baseline failing @ <sha>". The suite was never red;
# the baseline never finished. Two causes, both fixed 2026-08-10, but the
# defaults are still wrong for a suite this size and this is where a repo is
# supposed to say so.
#
# Measured on this machine, 2026-08-10:
#   whole tree   `pytest -q`             1141 s   <- what the baseline used to run
#   [tests].command  `pytest -q tests/unit`  305 s   <- what it runs now
#
# wall_budget_s is the WHOLE item, and the clock starts BEFORE the baseline.
# At the default 600 s a 305 s baseline leaves 295 s -- less than one stage-2
# confirm (305 s), so the loop truncated the moment it started and the fix
# would have bought a healthy-looking `ok` with still no findings. 1800 s
# fits the baseline, ~10 targeted stage-1 runs, and 2-3 confirms.
#
# This costs nothing at the gate: mutation is an async drain consumer that
# blocks no push and no commit. It only bounds how long a 4-hourly background
# drain may spend.
#
# mutant_timeout_s stays at the default 120 s. It governs TARGETED stage-1
# runs (one test file, seconds here); the whole-command runs derive their own
# budget from it (`* 4` = 480 s), which clears the measured 305 s with 57%
# headroom. Re-measure before assuming that still holds -- tests/unit grows
# with every task, and 480 s is the number that will bite when it stops.
#
# IT BIT. Read from this repo's own ledger, 2026-08-11, while fixing the same
# defect reported by a consumer repo:
#
#   2026-08-09T18:06  degraded  483.6 s  "baseline failing @ d6167f88dc77"
#   2026-08-09T22:06  degraded  482.8 s  "baseline failing @ d6167f88dc77"
#   2026-08-11T10:15  degraded  487.5 s  "baseline failing @ e3001743de3b"
#
# Three runs inside a 1% spread of the 480 s derived budget -- the signature of
# a budget, not of a red suite, which is exactly the diagnostic the consumer
# repo used on us. tests/unit was never red on any of those days; it had simply
# grown past 480 s under drain conditions. aramid was carrying the very bug it
# was reporting, in its own ledger, and reporting it in the very words the
# report was about.
#
# So this is SET, not left to the derived default. 900 s against a suite
# measured at 244 s standalone and ~480+ s in a cold worktree -- the gap is
# worktree setup and cold imports, so size against the drain figure, not the
# standalone one. `extra["baseline_s"]` on every successful run now records
# what the baseline actually took, so the next revision of this number is
# measured rather than guessed.
[mutation]
# Mutation's baseline is NOT the gate's suite -- see `mutation._full_argv`.
# `[tests].command` is now CI's whole tree (~1141 s) and the mutation baseline
# is budgeted at `mutant_timeout_s * 4`, so inheriting it would recreate the
# original defect exactly: 44 drains, zero findings, every one reporting
# "baseline failing" when the truth was that it never finished. tests/unit
# (~305 s) fits, and `test_this_repos_mutation_baseline_is_not_the_whole_tree`
# fails if these two ever converge again.
test_command = ["python", "-m", "pytest", "-q", "tests/unit"]
wall_budget_s = 1800
baseline_timeout_s = 900

[shadow]
# Armed HERE, on the repo that ships the check. A module-shadow of this tool at
# this root would hijack aramid's own gate using aramid's own working tree, so
# there is no bake case for it -- and the check is verified clean today: no
# `aramid.py`, no `aramid/__init__.py`, no graphite equivalent at the root.
# Ships DISARMED for consumers (policy.classify); this line is the opt-in.
shadow_block_armed = true
